# Publishes index.html + the break packs to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source = GitHub Actions.
# Without it the deploy job fails ("Pages source is not set to GitHub Actions").
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp breaks.js  _site/
          cp breaks2.js _site/ || true
          cp breaks3.js _site/ || true
          : > _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
